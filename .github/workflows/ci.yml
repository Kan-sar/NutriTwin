name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-chem.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps/api/src packages/domain/src packages/data_pipeline/src services/worker/src scripts
      - run: python scripts/validate_data.py --require-rdkit
      - run: pytest --cov --cov-report=term-missing
      - run: alembic upgrade head
      - run: alembic check
      - run: pip-audit
      - run: git ls-files -z | xargs -0 detect-secrets-hook --no-verify
      - run: docker compose -f infra/docker/compose.yaml config --quiet
